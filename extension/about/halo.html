<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>halo.spaces</title>
<link rel="stylesheet" href="halo.css">
<script src="halo.js" defer></script>
</head>
<body>
  <header>
    <img class="icon" src="icon.svg" alt="">
    <div>
      <h1>halo.spaces</h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <p class="note" id="platform-note" hidden></p>

  <main>
    <button id="update" class="capsule">
      <span class="label" data-de="Nach Updates suchen" data-en="Check for Updates"></span>
      <span class="status" id="update-status"></span>
    </button>
    <button id="photos" class="capsule" hidden>
      <span class="label"></span>
      <span class="status" id="photos-status"></span>
    </button>
    <button id="feedback" class="capsule">
      <span class="label" data-de="Feedback senden" data-en="Send Feedback"></span>
    </button>
    <button id="donate" class="capsule donate">
      <span class="label" data-de="Danke sagen" data-en="Say Thanks"></span>
      <img class="coffee" src="coffee.svg" alt="">
    </button>
  </main>

  <footer>
    <span data-de="Feedback oder Ideen?" data-en="Feedback or ideas?"></span>
    <a href="#" id="mail"></a>
  </footer>
</body>
</html>
